[project]
name = "hybrid-rag-for-ecommerce"
version = "0.1.0"
description = "Hybrid (BM25 + vector) retrieval and conversational product search over the Kith catalog."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "beautifulsoup4>=4.12",
    "psycopg[binary,pool]>=3.1",
    "python-dotenv>=1.0",
    "openai>=1.66",          # Responses API with structured outputs (responses.parse)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The repo is an application, not a library: these are the packages that
# `pip install -e .` makes importable. tests/ and frontend/ are left out.
[tool.setuptools.packages.find]
include = ["app*", "ingestion*", "evals*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"      # run `async def` tests without a decorator on each
testpaths = ["tests"]