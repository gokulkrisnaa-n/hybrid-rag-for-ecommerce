# Production overlay for the EC2 server. On the server, .env sets
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
# so every `docker compose` command (and the scripts) uses both files.
#
# Changes from the local setup:
#   - Caddy in front: HTTPS with an automatic Let's Encrypt certificate
#   - the app and the database are not reachable from the internet
#   - log sizes capped so logs can't fill the disk

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    ports: !override
      - "127.0.0.1:5433:5432"         # only from the server itself (psql), never from outside
    restart: unless-stopped
    logging: *logging

  app:
    ports: !reset []                  # reached only through Caddy
    environment:
      TRACING_ENVIRONMENT: production
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    container_name: kith-caddy
    ports:
      - "80:80"                       # Let's Encrypt check + redirect to HTTPS
      - "443:443"
      - "443:443/udp"                 # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env, e.g. 3-91-12-34.sslip.io}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data              # certificates: keep them, or Let's Encrypt rate limits bite
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
  caddy_config: