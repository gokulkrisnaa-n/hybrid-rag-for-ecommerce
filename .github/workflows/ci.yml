# Every push and pull request: backend tests, frontend checks, and a production
# image build, in parallel. No secrets: the tests fake OpenAI, Langfuse and the
# database. The evals (real catalog + paid model calls) stay a manual step.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install the locked dependencies
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
          pip install "pytest>=8" "pytest-asyncio>=0.23"
          pip check

      - name: Run the tests
        run: python -m pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build

  docker:
    name: Docker image builds
    # ARM, like the EC2 server (t4g): the image is checked on the architecture it runs on.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: kith-rag-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max